<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEDIT-CODE Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070d;--panel:#0f0f1a;--line:#23233a;--tx:#ecebf5;--mute:#8a89a6;--gold:#e6c36a;--purple:#8b6cff;--ok:#5fd6a0;--bad:#ff6b7a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#030307;color:var(--tx);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#fit{width:calc(540px*var(--s));height:calc(960px*var(--s));flex:none}
.stage{width:540px;height:960px;transform:scale(var(--s));transform-origin:0 0;background:radial-gradient(120% 60% at 50% 0%,#17142b 0%,var(--bg) 60%);position:relative;overflow:hidden;border-radius:18px}
.cam{position:absolute;inset:0;padding:48px 34px}
.scene{position:absolute;inset:48px 34px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:600 14px 'JetBrains Mono',monospace;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.hook{font-weight:800;font-size:54px;line-height:1.05;letter-spacing:-.02em}
.hook em{font-style:normal;color:var(--gold)}
.sub{color:var(--mute);font-size:20px;line-height:1.4}
.win{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 0 40px rgba(139,108,255,.12)}
.bar{display:flex;gap:7px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);font:400 13px 'JetBrains Mono',monospace;color:var(--mute)}
.bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.code{padding:14px 0;font:400 19px/1.65 'JetBrains Mono',monospace}
.ln{padding:0 16px;border-left:3px solid transparent;min-height:31px;white-space:pre}
.ln.c{color:var(--mute)}
.cur::after{content:'▍';color:var(--gold);animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.btn{align-self:flex-start;background:linear-gradient(135deg,var(--gold),#c79b3b);color:#14110a;font-weight:800;font-size:20px;padding:14px 28px;border-radius:12px;box-shadow:0 0 28px rgba(230,195,106,.35)}
.term{padding:14px 16px;font:400 18px/1.6 'JetBrains Mono',monospace;min-height:150px}
.term .p{color:var(--purple)}.term .ok{color:var(--ok)}.term .er{color:var(--bad)}
.stat{display:flex;align-items:baseline;gap:12px}
.num{font-weight:800;font-size:76px;letter-spacing:-.03em;color:var(--gold);text-shadow:0 0 30px rgba(230,195,106,.35)}
.lab{color:var(--mute);font-size:18px}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.prog>div{height:100%;width:100%;transform-origin:0 0;background:linear-gradient(90deg,var(--purple),var(--gold))}
svg.g{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.wipe{position:absolute;inset:0;background:linear-gradient(120deg,var(--purple),var(--gold));transform:translateY(100%);z-index:9}
.ctl{display:flex;gap:10px;align-items:center;width:min(540px,92vw);flex:none}
.ctl button{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:9px 16px;font:600 14px Inter,sans-serif;cursor:pointer}
.ctl button:first-child{border-color:var(--gold);color:var(--gold)}
.ctl input{flex:1;accent-color:var(--gold)}.ctl span{font:12px 'JetBrains Mono',monospace;color:var(--mute);min-width:44px;text-align:right}
</style></head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useRef,useEffect,useState,useLayoutEffect}=React;

/* ============ 1. CONTENT — edit only this per video ============ */
const CONTENT={
  eyebrow:"Sovereign Emperor · Money in Code",
  hook:["Your money grows","<em>on its own.</em>"],
  sub:"Compound interest in 6 lines.",
  editor:{file:"compound.js",lines:[
    "// $1,000 at 8% a year",
    "let balance = 1000;",
    "for (let y = 1; y <= 20; y++) {",
    "  balance *= 1.08;",
    "}",
    "console.log(balance);"],
    highlight:3},
  button:"Run",
  terminal:{cmd:"node compound.js",out:["year 5   →  $1,469","year 10  →  $2,159","year 20  →  $4,661"]},
  counter:{from:1000,to:4661,prefix:"$",label:"after 20 years"},
  graph:{label:"Balance over time",points:[1000,1166,1360,1587,1851,2159,2518,2937,3426,3996,4661]},
  conclusion:["Time does the work.","<em>Start early.</em>"],
  timing:{cps:34,beat:.45}
};

/* ============ 2. ENGINE — reusable primitives ============ */
const Engine={
  pause:(tl,d=.4)=>tl.to({},{duration:d}),
  fade:(tl,t,o={})=>tl.to(t,{autoAlpha:o.to??1,duration:o.d??.5,ease:'power2.out'},o.at),
  reveal:(tl,t,o={})=>tl.fromTo(t,{autoAlpha:0,y:o.y??26},{autoAlpha:1,y:0,duration:o.d??.65,ease:'power3.out',stagger:o.stagger??0},o.at),
  slide:(tl,t,o={})=>tl.fromTo(t,{autoAlpha:0,x:o.x??80},{autoAlpha:1,x:0,duration:o.d??.7,ease:'expo.out'},o.at),
  scale:(tl,t,o={})=>tl.fromTo(t,{autoAlpha:0,scale:o.from??.85},{autoAlpha:1,scale:1,duration:o.d??.6,ease:'back.out(1.6)'},o.at),
  zoom:(tl,t,o={})=>tl.to(t,{scale:o.to??1.08,duration:o.d??.8,ease:'power2.inOut'},o.at),
  highlight:(tl,t,o={})=>tl.to(t,{backgroundColor:'rgba(230,195,106,.14)',borderLeftColor:'#e6c36a',duration:.3},o.at),
  glitch:(tl,t)=>tl.to(t,{x:'+=7',skewX:8,duration:.04,repeat:5,yoyo:true,ease:'none'}).set(t,{x:0,skewX:0}),
  shake:(tl,t,i=8)=>tl.to(t,{x:`+=${i}`,duration:.05,repeat:7,yoyo:true,ease:'sine.inOut'}).set(t,{x:0}),
  typeText:(tl,el,text,o={})=>{const s={n:0};return tl.fromTo(s,{n:0},{n:text.length,duration:text.length/(o.cps||30),ease:'none',onUpdate(){el.textContent=text.slice(0,Math.round(s.n))}},o.at)},
  counter:(tl,el,c,o={})=>{const s={v:c.from};return tl.fromTo(s,{v:c.from},{v:c.to,duration:o.d??1.8,ease:'power2.out',onUpdate(){el.textContent=c.prefix+Math.round(s.v).toLocaleString()}},o.at)},
  progressBar:(tl,el,o={})=>tl.fromTo(el,{scaleX:0},{scaleX:1,duration:o.d??1.8,ease:'power2.inOut'},o.at),
  graph:(tl,path,o={})=>{const L=path.getTotalLength();return tl.fromTo(path,{strokeDasharray:L,strokeDashoffset:L},{strokeDashoffset:0,duration:o.d??1.8,ease:'power2.inOut'},o.at)},
  execute:(tl,btn)=>tl.to(btn,{scale:.92,duration:.1}).to(btn,{scale:1,boxShadow:'0 0 60px rgba(230,195,106,.8)',duration:.3,ease:'back.out(3)'}),
  error:(tl,t)=>{Engine.shake(tl,t);return tl.to(t,{color:'#ff6b7a',duration:.2})},
  success:(tl,t)=>tl.fromTo(t,{scale:1},{scale:1.12,color:'#5fd6a0',duration:.25,yoyo:true,repeat:1,ease:'power2.out'}),
  cameraPunch:(tl,cam,a=.035)=>tl.to(cam,{scale:1+a,duration:.12,ease:'power2.out'}).to(cam,{scale:1,duration:.5,ease:'elastic.out(1,.5)'}),
  sceneTransition:(tl,wipe)=>tl.to(wipe,{yPercent:-100,duration:.55,ease:'power3.inOut',startAt:{yPercent:0}})
              .set(wipe,{yPercent:100}),
};

/* ============ 3. COMPONENTS — dumb visuals driven by CONTENT ============ */
const W=460,H=210;
function pathFrom(pts){const mx=Math.max(...pts),mn=Math.min(...pts);
  return pts.map((p,i)=>`${i?'L':'M'}${20+i*(W-40)/(pts.length-1)},${H-20-((p-mn)/(mx-mn))*(H-40)}`).join(' ')}
const Editor=({d})=>(<div className="win ed"><div className="bar"><i/><i/><i/><span style={{marginLeft:8}}>{d.file}</span></div>
  <div className="code">{d.lines.map((l,i)=><div key={i} className={'ln'+(l.startsWith('//')?' c':'')} data-ln={i}/>)}</div></div>);
const Terminal=({d})=>(<div className="win tm"><div className="bar"><i/><i/><i/><span style={{marginLeft:8}}>terminal</span></div>
  <div className="term"><div><span className="p">$ </span><span className="cmd"/></div>{d.out.map((_,i)=><div key={i} className="out"/>)}</div></div>);
const Graph=({d})=>(<svg className="g gr" viewBox={`0 0 ${W} ${H}`}>
  <path d={pathFrom(d.points)} fill="none" stroke="#e6c36a" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" style={{filter:'drop-shadow(0 0 8px rgba(230,195,106,.5))'}}/>
  <text x="20" y="24" fill="#8a89a6" fontSize="13" fontFamily="JetBrains Mono">{d.label}</text></svg>);

/* ============ 4. SCENES + TIMELINE — compose primitives ============ */
function buildTimeline(q,C,onUpdate){
  const E=Engine,b=C.timing.beat,cps=C.timing.cps,tl=gsap.timeline({paused:true,onUpdate});
  const one=s=>q(s)[0];
  gsap.set(q('.s1 > *,.s2 > *,.s3 > *,.s4 > *'),{autoAlpha:0});
  gsap.set(q('.s1,.s2,.s3,.s4'),{autoAlpha:1});

  // Scene 1 — hook
  E.reveal(tl,q('.s1 > *'),{stagger:.18}); E.pause(tl,1.2);
  E.sceneTransition(tl,one('.wipe')); tl.set(q('.s1'),{autoAlpha:0});

  // Scene 2 — editor: TYPE → HIGHLIGHT → CLICK → EXECUTE
  E.slide(tl,q('.s2 > *'),{x:70});
  const lines=q('.ln'); C.editor.lines.forEach((t,i)=>{E.typeText(tl,lines[i],t,{cps});E.pause(tl,.08)});
  E.pause(tl,b); E.highlight(tl,lines[C.editor.highlight]); E.zoom(tl,one('.ed'),{to:1.03,d:.5});
  E.pause(tl,b); E.execute(tl,one('.btn')); E.cameraPunch(tl,one('.cam'));
  tl.set(q('.s2'),{autoAlpha:0});

  // Scene 3 — result: terminal → counter → progress → graph
  E.reveal(tl,q('.s3 > *')); const tm=C.terminal;
  E.typeText(tl,one('.cmd'),tm.cmd,{cps});
  q('.out').forEach((el,i)=>{E.pause(tl,.2);E.typeText(tl,el,tm.out[i],{cps:cps*1.3})});
  E.counter(tl,one('.num'),C.counter,{at:'>'}); E.progressBar(tl,one('.prog > div'),{at:'<'});
  E.graph(tl,one('.gr path'),{at:'<'}); E.success(tl,one('.num')); E.cameraPunch(tl,one('.cam'),.02);
  E.pause(tl,1);
  E.sceneTransition(tl,one('.wipe')); tl.set(q('.s3'),{autoAlpha:0});

  // Scene 4 — conclusion
  E.scale(tl,q('.s4 > *'),{from:.9}); E.pause(tl,2.2);
  return tl;
}

function App(){
  const C=CONTENT,stage=useRef(),tl=useRef(),[t,setT]=useState(0),[dur,setDur]=useState(1);
  useLayoutEffect(()=>{const f=()=>{const s=Math.min(innerWidth*.92/540,(innerHeight-90)/960,1.4);
    document.documentElement.style.setProperty('--s',s)};f();addEventListener('resize',f);return()=>removeEventListener('resize',f)},[]);
  useEffect(()=>{const q=gsap.utils.selector(stage.current);
    tl.current=buildTimeline(q,C,()=>setT(tl.current.time()));setDur(tl.current.duration());
    tl.current.play();return()=>tl.current.kill()},[]);
  const html=a=>a.map((l,i)=><div key={i} dangerouslySetInnerHTML={{__html:l}}/>);
  return(<>
    <div id="fit"><div className="stage" ref={stage}><div className="cam">
      <div className="scene s1" style={{justifyContent:'center'}}><div className="eyebrow">{C.eyebrow}</div><div className="hook">{html(C.hook)}</div><div className="sub">{C.sub}</div></div>
      <div className="scene s2" style={{justifyContent:'center'}}><Editor d={C.editor}/><div className="btn">▶ {C.button}</div></div>
      <div className="scene s3" style={{justifyContent:'center'}}><Terminal d={C.terminal}/>
        <div className="stat"><div className="num">{C.counter.prefix}{C.counter.from}</div><div className="lab">{C.counter.label}</div></div>
        <div className="prog"><div/></div><Graph d={C.graph}/></div>
      <div className="scene s4" style={{justifyContent:'center'}}><div className="hook" style={{fontSize:58}}>{html(C.conclusion)}</div></div>
    </div><div className="wipe"/></div></div>
    <div className="ctl"><button onClick={()=>tl.current.restart()}>↻ Replay</button><button onClick={()=>tl.current.pause(0)}>Reset</button>
      <input type="range" min="0" max={dur} step=".01" value={t} onChange={e=>tl.current.pause(+e.target.value)}/><span>{t.toFixed(1)}s</span></div>
  </>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
